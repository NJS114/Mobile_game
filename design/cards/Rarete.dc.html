<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .stage {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: #FBF3E7;
      font-family: system-ui, sans-serif;
    }
    .row { display: flex; gap: 46px; align-items: flex-start; }
    .col { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .label { font: 600 13px system-ui, sans-serif; color: #4A3222; letter-spacing: 0.5px; }

    .mini-card {
      width: 168px; height: 232px;
      border-radius: 20px;
      background: #4A3222;
      padding: 8px;
    }
    .mini-inner {
      position: relative;
      width: 100%; height: 100%;
      border-radius: 14px;
      background: #F7E4CE;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .mini-art {
      flex: 1 1 auto;
      background: #F0D2AE;
      display: flex; align-items: center; justify-content: center;
    }
    .mini-name {
      color: #FBF3E7; text-align: center;
      font: 700 13px "Fredoka", sans-serif;
      padding: 6px 8px;
    }

    .common .mini-inner { border: 4px solid #A99A82; }
    .common .mini-name { background: #A99A82; }

    .rare .mini-inner { border: 4px solid #6E9BC7; box-shadow: inset 0 0 0 2px #FBF3E7, inset 0 0 0 5px #6E9BC7; }
    .rare .mini-name { background: #6E9BC7; }
    .rare .mini-card { box-shadow: 0 0 18px rgba(110,155,199,0.55); }

    .legendary .mini-inner { border: 4px solid #D9A63E; box-shadow: inset 0 0 0 2px #FBF3E7, inset 0 0 0 5px #D9A63E; }
    .legendary .mini-name { background: #D9A63E; color: #4A3222; }
    .legendary .mini-card { box-shadow: 0 0 26px rgba(217,166,62,0.65); }
    .gem {
      position: absolute; width: 12px; height: 12px; background: #D9A63E;
      border: 2px solid #4A3222; transform: rotate(45deg); z-index: 3;
    }
    .gem-tl { top: -6px; left: -6px; }
    .gem-tr { top: -6px; right: -6px; }
  </style>
</helmet>

<div class="stage">
  <div class="row">

    <div class="col common">
      <div class="mini-card">
        <div class="mini-inner">
          <div class="mini-art">
            <svg width="90" height="90" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
              <path d="M70 55 L60 15 L100 45 Z" fill="#E3B583" stroke="#4A3222" stroke-width="6" stroke-linejoin="round"/>
              <path d="M150 55 L168 12 L128 44 Z" fill="#E3B583" stroke="#4A3222" stroke-width="6" stroke-linejoin="round"/>
              <circle cx="110" cy="105" r="55" fill="#E3B583" stroke="#4A3222" stroke-width="6"/>
              <circle cx="90" cy="100" r="15" fill="#FFFFFF" stroke="#4A3222" stroke-width="4"/>
              <circle cx="93" cy="102" r="7" fill="#4A3222"/>
              <path d="M128 102 Q140 92 152 102" fill="none" stroke="#4A3222" stroke-width="5" stroke-linecap="round"/>
              <path d="M104 122 L116 122 L110 130 Z" fill="#D97B6C" stroke="#4A3222" stroke-width="2"/>
            </svg>
          </div>
          <div class="mini-name">Nom de la carte</div>
        </div>
      </div>
      <div class="label">COMMUNE</div>
    </div>

    <div class="col rare">
      <div class="mini-card">
        <div class="mini-inner">
          <div class="mini-art">
            <svg width="90" height="90" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
              <path d="M70 55 L60 15 L100 45 Z" fill="#E3B583" stroke="#4A3222" stroke-width="6" stroke-linejoin="round"/>
              <path d="M150 55 L168 12 L128 44 Z" fill="#E3B583" stroke="#4A3222" stroke-width="6" stroke-linejoin="round"/>
              <circle cx="110" cy="105" r="55" fill="#E3B583" stroke="#4A3222" stroke-width="6"/>
              <circle cx="90" cy="100" r="15" fill="#FFFFFF" stroke="#4A3222" stroke-width="4"/>
              <circle cx="93" cy="102" r="7" fill="#4A3222"/>
              <path d="M128 102 Q140 92 152 102" fill="none" stroke="#4A3222" stroke-width="5" stroke-linecap="round"/>
              <path d="M104 122 L116 122 L110 130 Z" fill="#D97B6C" stroke="#4A3222" stroke-width="2"/>
            </svg>
          </div>
          <div class="mini-name">Nom de la carte</div>
        </div>
      </div>
      <div class="label">RARE</div>
    </div>

    <div class="col legendary">
      <div class="mini-card">
        <div class="mini-inner">
          <div class="gem gem-tl"></div>
          <div class="gem gem-tr"></div>
          <div class="mini-art">
            <svg width="90" height="90" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
              <path d="M70 55 L60 15 L100 45 Z" fill="#E3B583" stroke="#4A3222" stroke-width="6" stroke-linejoin="round"/>
              <path d="M150 55 L168 12 L128 44 Z" fill="#E3B583" stroke="#4A3222" stroke-width="6" stroke-linejoin="round"/>
              <circle cx="110" cy="105" r="55" fill="#E3B583" stroke="#4A3222" stroke-width="6"/>
              <circle cx="90" cy="100" r="15" fill="#FFFFFF" stroke="#4A3222" stroke-width="4"/>
              <circle cx="93" cy="102" r="7" fill="#4A3222"/>
              <path d="M128 102 Q140 92 152 102" fill="none" stroke="#4A3222" stroke-width="5" stroke-linecap="round"/>
              <path d="M104 122 L116 122 L110 130 Z" fill="#D97B6C" stroke="#4A3222" stroke-width="2"/>
            </svg>
          </div>
          <div class="mini-name">Nom de la carte</div>
        </div>
      </div>
      <div class="label">LEGENDAIRE</div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
