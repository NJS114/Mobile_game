<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .stage {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: #FBF3E7;
      font-family: system-ui, sans-serif;
    }
    .card {
      width: 300px; height: 430px;
      border-radius: 24px;
      background: #4A3222;
      padding: 10px;
      box-shadow: 0 14px 28px rgba(74,50,34,0.28);
    }
    .card-inner {
      position: relative;
      width: 100%; height: 100%;
      border-radius: 17px;
      background: #EFE6D3;
      border: 4px solid #A6926B;
      display: flex; flex-direction: column;
    }
    .cost-badge {
      position: absolute; top: -14px; left: -14px; z-index: 3;
      width: 46px; height: 46px; border-radius: 50%;
      background: #A6926B; border: 4px solid #4A3222;
      display: flex; align-items: center; justify-content: center;
      font: 700 20px "Fredoka", sans-serif; color: #FBF3E7;
      box-shadow: 0 3px 6px rgba(0,0,0,0.2);
    }
    .rarity-band {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 3;
      background: #A6926B; color: #FBF3E7;
      font: 600 11px system-ui, sans-serif; letter-spacing: 1.5px;
      padding: 4px 14px; border-radius: 10px;
    }
    .art-panel {
      position: relative;
      height: 190px;
      border-top-left-radius: 13px; border-top-right-radius: 13px;
      background: #E6D9BC;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .name-plate {
      background: #8A7550; color: #FBF3E7; text-align: center;
      font: 700 20px "Fredoka", sans-serif;
      padding: 9px 12px 3px;
    }
    .type-line {
      text-align: center; font: 600 11px system-ui, sans-serif;
      color: #6B5A3A; letter-spacing: 0.5px; padding: 4px 0 8px;
      background: #EFE6D3;
    }
    .effect-text {
      flex: 1 1 auto; margin: 0 14px 14px;
      background: #FBF3E7; border: 2px solid #D8C7A2; border-radius: 10px;
      padding: 10px 12px; font: 500 13px system-ui, sans-serif;
      color: #4A3222; line-height: 1.4;
      display: flex; align-items: center; text-align: center;
    }
  </style>
</helmet>

<div class="stage">
  <div class="card">
    <div class="card-inner">
      <div class="cost-badge">2</div>
      <div class="rarity-band">OBJET</div>

      <div class="art-panel">
        <svg width="150" height="150" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
          <rect x="45" y="98" width="130" height="24" rx="12" fill="#F3E4C8" stroke="#4A3222" stroke-width="5"/>
          <circle cx="45" cy="90" r="20" fill="#F3E4C8" stroke="#4A3222" stroke-width="5"/>
          <circle cx="45" cy="130" r="20" fill="#F3E4C8" stroke="#4A3222" stroke-width="5"/>
          <circle cx="175" cy="90" r="20" fill="#F3E4C8" stroke="#4A3222" stroke-width="5"/>
          <circle cx="175" cy="130" r="20" fill="#F3E4C8" stroke="#4A3222" stroke-width="5"/>
        </svg>
      </div>

      <div class="name-plate">Os d'Attraction</div>
      <div class="type-line">OBJET &bull; DESTABILISATION &bull; FACTION CHAT</div>
      <div class="effect-text">
        Fait reculer une carte chien d'une case et lui fait perdre son action.
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
