<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .stage {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: #FBF3E7;
      font-family: system-ui, sans-serif;
    }
    .card {
      width: 300px; height: 430px;
      border-radius: 24px;
      background: #4A3222;
      padding: 10px;
      box-shadow: 0 14px 28px rgba(74,50,34,0.28);
    }
    .card-inner {
      position: relative;
      width: 100%; height: 100%;
      border-radius: 17px;
      background: #E3E7EA;
      border: 4px solid #6E7C8C;
      display: flex; flex-direction: column;
    }
    .cost-badge {
      position: absolute; top: -14px; left: -14px; z-index: 3;
      width: 46px; height: 46px; border-radius: 50%;
      background: #6E7C8C; border: 4px solid #4A3222;
      display: flex; align-items: center; justify-content: center;
      font: 700 20px "Fredoka", sans-serif; color: #FBF3E7;
      box-shadow: 0 3px 6px rgba(0,0,0,0.2);
    }
    .trait-badge {
      position: absolute; top: -14px; right: -14px; z-index: 3;
      width: 40px; height: 40px; border-radius: 50%;
      border: 4px solid #4A3222; background: #7A5B3D;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 3px 6px rgba(0,0,0,0.2);
    }
    .rarity-band {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 3;
      background: #D9A63E; color: #4A3222;
      font: 600 11px system-ui, sans-serif; letter-spacing: 1.5px;
      padding: 4px 14px; border-radius: 10px;
    }
    .art-panel {
      position: relative;
      height: 232px;
      border-top-left-radius: 13px; border-top-right-radius: 13px;
      background: #CBD3D8;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .name-plate {
      background: #4F5D6B; color: #FBF3E7; text-align: center;
      font: 700 20px "Fredoka", sans-serif;
      padding: 9px 12px 3px;
    }
    .type-line {
      text-align: center; font: 500 12px system-ui, sans-serif;
      color: #4F5D6B; padding-bottom: 8px; background: #E3E7EA; flex: 1 1 auto;
    }
    .stat {
      position: absolute; bottom: -14px; z-index: 3;
      width: 48px; height: 48px; border-radius: 50%;
      border: 4px solid #4A3222;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #FBF3E7; box-shadow: 0 3px 6px rgba(0,0,0,0.2);
    }
    .stat span { font: 700 15px "Fredoka", sans-serif; line-height: 1; margin-top: 1px; }
    .stat-attack { left: -14px; background: #C9744B; }
    .stat-defense { right: -14px; background: #7A8B5B; }
  </style>
</helmet>

<div class="stage">
  <div class="card">
    <div class="card-inner">
      <div class="cost-badge">7</div>
      <div class="trait-badge" title="Vehicule au sol">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="#FBF3E7" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="10" cy="5" rx="3.2" ry="3"/>
          <ellipse cx="10" cy="14" rx="6" ry="8"/>
        </svg>
      </div>
      <div class="rarity-band">LEGENDAIRE</div>

      <div class="art-panel">
        <svg width="172" height="172" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
          <rect x="18" y="158" width="184" height="26" rx="13" fill="#4A3222"/>
          <circle cx="45" cy="171" r="13" fill="#2E2018"/>
          <circle cx="85" cy="171" r="13" fill="#2E2018"/>
          <circle cx="125" cy="171" r="13" fill="#2E2018"/>
          <circle cx="165" cy="171" r="13" fill="#2E2018"/>
          <rect x="30" y="110" width="160" height="55" rx="16" fill="#8A9B6E" stroke="#4A3222" stroke-width="5"/>
          <rect x="70" y="70" width="80" height="48" rx="18" fill="#8A9B6E" stroke="#4A3222" stroke-width="5"/>
          <rect x="140" y="82" width="60" height="16" rx="8" fill="#8A9B6E" stroke="#4A3222" stroke-width="5"/>
          <circle cx="112" cy="66" r="7" fill="#8A9B6E" stroke="#4A3222" stroke-width="4"/>
          <circle cx="95" cy="92" r="12" fill="#FFFFFF" stroke="#4A3222" stroke-width="4"/>
          <circle cx="98" cy="94" r="5" fill="#4A3222"/>
          <circle cx="127" cy="92" r="12" fill="#FFFFFF" stroke="#4A3222" stroke-width="4"/>
          <circle cx="130" cy="94" r="5" fill="#4A3222"/>
        </svg>
      </div>

      <div class="name-plate">Bouledozer</div>
      <div class="type-line">Vehicule &bull; Char blinde (sol)</div>

      <div class="stat stat-attack">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 20 L15 9" stroke="#FBF3E7" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M13 5 L19 5 L19 11 L15.5 14.5 L9.5 8.5 Z" fill="#FBF3E7"/>
          <path d="M4 20 L7 20 L7 17" stroke="#FBF3E7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>8</span>
      </div>
      <div class="stat stat-defense">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2.5 L20 6 V11.5 C20 17 12 21.5 12 21.5 C12 21.5 4 17 4 11.5 V6 Z" fill="#FBF3E7"/>
        </svg>
        <span>12</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
