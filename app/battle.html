<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Paw & Claw - Prototype</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <a href="index.html" class="back-home" title="Retour a l'accueil">&larr;</a>

  <div id="table">
    <div class="player-bar enemy-bar" id="hero-chien">
      <div class="player-avatar">🐕</div>
      <div class="player-info">
        <div class="player-name">Chiens</div>
        <div class="player-hp">❤ <span id="hp-chien"></span></div>
      </div>
      <div class="deck-count" id="deck-chien"></div>
      <div class="mana-display" id="mana-chien"></div>
    </div>

    <div id="enemy-hand-count" class="hand-count"></div>
    <div id="enemy-hand" class="hand-strip"></div>

    <div id="battlefield">
      <div id="enemy-board" class="board-row board-row-enemy"></div>
      <div class="center-divider">
        <div class="turn-info" id="turn-info"></div>
        <div id="action-bar"></div>
      </div>
      <div id="own-board" class="board-row board-row-own"></div>
    </div>

    <div class="player-bar own-bar" id="hero-chat">
      <div class="player-avatar">🐈</div>
      <div class="player-info">
        <div class="player-name">Chats</div>
        <div class="player-hp">❤ <span id="hp-chat"></span></div>
      </div>
      <div class="deck-count" id="deck-chat"></div>
      <div class="mana-display" id="mana-chat"></div>
    </div>
  </div>

  <div id="log"></div>

  <div id="hand-zone"></div>

  <div id="victory-overlay" class="hidden">
    <h1 id="victory-text"></h1>
    <button id="restart-btn">Nouvelle partie</button>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
